spring.application.name=VRSoftware
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/vrsoftware
spring.datasource.username=postgres
spring.datasource.password=000001
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate - Cria��o autom�tica de tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Manter a conexao ativa mesmo se nao utilizada por muito tempo
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
